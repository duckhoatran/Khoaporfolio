  <!-- employer -->
  <rect x="90" y="290" width="280" height="160" rx="18" fill="#c9b8e8"/>
  <text x="230" y="360" fill="#1c1c24" font-size="24" font-weight="700" text-anchor="middle">EMPLOYER</text>
