  <!-- split -->
  <path d="M370 340 C 470 295, 520 265, 620 235" fill="none" stroke="#5f5a67" stroke-width="3"/>
  <path d="M370 400 C 470 445, 520 475, 620 505" fill="none" stroke="#5f5a67" stroke-width="3"/>

  <!-- wages -->
